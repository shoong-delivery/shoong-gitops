apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-shoong-notification
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/shoong-delivery/shoong-gitops
      targetRevision: troubleshoot/argocd-outofsync
      path: charts/shoong-app
      helm:
        valueFiles:
          - $values/envs/prod/shoong-notification.yaml
    - repoURL: https://github.com/shoong-delivery/shoong-gitops
      targetRevision: troubleshoot/argocd-outofsync
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shoong
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
