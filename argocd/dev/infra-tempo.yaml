apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        valueFiles:
          - $values/infra/tempo/values.yaml
          - $values/infra/tempo/values-dev.yaml
    - repoURL: https://github.com/shoong-delivery/shoong-gitops
      targetRevision: troubleshoot/tempo-oomkilled # [재현용] 512Mi values를 재현 브랜치에서 읽기 위함 (원복 시 HEAD)
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
