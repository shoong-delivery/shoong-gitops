apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/shoong-delivery/shoong-gitops
    targetRevision: HEAD
    path: infra/monitoring-config/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
