apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-argocd-notifications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/shoong-delivery/shoong-gitops
    targetRevision: HEAD
    path: infra/argocd-notifications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
