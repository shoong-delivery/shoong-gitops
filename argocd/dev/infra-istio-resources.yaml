apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-istio-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/shoong-delivery/shoong-gitops
    targetRevision: troubleshoot/tempo-oomkilled # [재현용] 스크립트가 브랜치에 push한 TG ARN을 읽기 위함 (원복 시 HEAD)
    path: infra/istio-resources/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
