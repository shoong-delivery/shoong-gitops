apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scenarios
  namespace: loadtest
data:
  common.js: |
    import http from "k6/http";
    import { check } from "k6";

    export const BASE_URL = __ENV.ALB_URL;

    if (!BASE_URL) {
      throw new Error(
        "ALB_URL 환경변수가 필요합니다."
      );
    }

    const MENU_IDS = [1, 2, 3, 4, 5];
    const USER_NAME = "tester";

    export function orderRequest() {
      const menuId = MENU_IDS[Math.floor(Math.random() * MENU_IDS.length)];
      const res = http.post(
        `${BASE_URL}/api/orders/${menuId}?userName=${USER_NAME}`
      );
      check(res, {
        "status is 200 or 201": (r) => r.status === 200 || r.status === 201,
      });
      return res;
    }

  load.js: |
    import { orderRequest } from "./common.js";

    export const options = {
      scenarios: {
        load: {
          executor: "ramping-arrival-rate",
          startRate: 0,
          timeUnit: "1s",
          preAllocatedVUs: 20,
          maxVUs: 200,
          stages: [
            { duration: "2m", target: 10 },
            { duration: "5m", target: 10 },
            { duration: "2m", target: 30 },
            { duration: "5m", target: 30 },
            { duration: "2m", target: 50 },
            { duration: "5m", target: 50 },
            { duration: "2m", target: 0 },
          ],
        },
      },
      thresholds: {
        http_req_duration: ["p(95)<500"],
        http_req_failed: ["rate<0.01"],
      },
    };

    export default function () {
      orderRequest();
    }

  spike.js: |
    import { orderRequest } from "./common.js";

    export const options = {
      scenarios: {
        spike: {
          executor: "ramping-arrival-rate",
          startRate: 0,
          timeUnit: "1s",
          preAllocatedVUs: 30,
          maxVUs: 300,
          stages: [
            { duration: "2m", target: 10 },
            { duration: "30s", target: 50 },
            { duration: "5m", target: 50 },
            { duration: "30s", target: 10 },
            { duration: "2m", target: 10 },
            { duration: "1m", target: 0 },
          ],
        },
      },
      thresholds: {
        http_req_duration: ["p(95)<500"],
        http_req_failed: ["rate<0.01"],
      },
    };

    export default function () {
      orderRequest();
    }
