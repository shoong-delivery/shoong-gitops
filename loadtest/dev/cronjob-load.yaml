apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-load-test
  namespace: loadtest
spec:
  # 절대 안 도는 schedule (2월 31일). 수동 trigger만 허용:
  #   kubectl create job --from=cronjob/k6-load-test \
  #     k6-load-$(date +%Y%m%d-%H%M%S) -n loadtest
  schedule: "0 0 31 2 *"
  suspend: true
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0          # 부하 테스트는 재시도하지 않음
      ttlSecondsAfterFinished: 86400   # 1일 후 Job 자동 정리
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: k6
              image: grafana/k6:0.55.0
              args:
                - run
                - --out
                - experimental-prometheus-rw
                - /scripts/load.js
              env:
                - name: ALB_URL
                  value: "http://shoong-dev-alb-2102400300.us-east-1.elb.amazonaws.com"
                - name: K6_PROMETHEUS_RW_SERVER_URL
                  value: "http://infra-monitoring-kube-prom-prometheus.monitoring.svc:9090/api/v1/write"
                - name: K6_PROMETHEUS_RW_TREND_STATS
                  value: "p(50),p(95),p(99)"
              resources:
                requests:
                  cpu: 500m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 512Mi
              volumeMounts:
                - name: scenarios
                  mountPath: /scripts
          volumes:
            - name: scenarios
              configMap:
                name: k6-scenarios
