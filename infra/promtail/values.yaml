config:
  # Loki gateway로 로그 전송
  clients:
    - url: http://infra-loki-gateway.monitoring.svc/loki/api/v1/push

  snippets:
    # 쿠버네티스 파드 로그 수집 + 메타데이터 레이블 추가
    # containerd 런타임의 CRI 포맷(`<timestamp> <stream> <flag> <body>`)을 파싱
    # → body의 JSON 로그가 Loki에 그대로 들어가 LogQL의 `| json`으로 풀어 쓸 수 있음
    pipelineStages:
      - cri: {}

    # 감시할 로그 경로 (DaemonSet으로 노드 전체 커버)
    # 라벨은 최소화 — 카디널리티 폭발과 Loki stream label limit(기본 15) 초과 방지.
    # `app` 라벨만 명시적으로 가져오고, 나머지 메타데이터는 본문(JSON)에서 LogQL로 풀어 씀.
    scrapeConfigs: |
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name]
            target_label: job
            separator: /
            replacement: $1
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
