defaultRules:
  disabled:
    KubeControllerManagerDown: true
    KubeSchedulerDown: true

prometheus:
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 7d

alertmanager:
  enabled: true
  alertmanagerSpec:
    alertmanagerConfigSelector:
      matchLabels:
        alertmanagerConfig: shoong
    alertmanagerConfigMatcherStrategy:
      type: None
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 100m

grafana:
  persistence:
    enabled: false
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://infra-loki-gateway.monitoring.svc:80
      access: proxy
      isDefault: false
    - name: Tempo
      type: tempo
      url: http://infra-tempo.monitoring.svc:3200
      access: proxy
      isDefault: false
