auth:
  strategy: anonymous

external_services:
  prometheus:
    url: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
  grafana:
    enabled: true
    in_cluster_url: "http://kube-prometheus-stack-grafana.monitoring.svc"

deployment:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
