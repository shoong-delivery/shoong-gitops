replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

service:
  enabled: true
  type: ClusterIP
  port: 3000

probe:
  enabled: true
  path: /health
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

# 다중 CronJob 지원 — batch 레포에서 단일 이미지로 여러 워크플로우 실행
# 예시 항목:
#   - name: cleanup
#     schedule: "0 1 * * *"
#     args: ["cleanup"]
cronjobs: []

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

env: {}

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

virtualService:
  enabled: false
  gateway: istio-system/shoong-gateway
  prefix: /api

# Istio DestinationRule — 서킷브레이커 (connectionPool + outlierDetection)
# enabled: true 일 때 Service 이름과 동일한 host로 정책 적용
destinationRule:
  enabled: false
  connectionPool:
    tcp:
      maxConnections: 100
    http:
      http1MaxPendingRequests: 50
      http2MaxRequests: 100
      maxRequestsPerConnection: 10
      maxRetries: 3
  outlierDetection:
    consecutive5xxErrors: 5
    interval: 30s
    baseEjectionTime: 30s
    maxEjectionPercent: 50