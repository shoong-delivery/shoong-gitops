replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

service:
  enabled: true
  type: ClusterIP
  port: 3000

probe:
  enabled: true
  path: /health
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

# 다중 CronJob 지원 — batch 레포에서 단일 이미지로 여러 워크플로우 실행
# 예시 항목:
#   - name: cleanup
#     schedule: "0 1 * * *"
#     args: ["cleanup"]
cronjobs: []

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s

env: {}

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

virtualService:
  enabled: false
  gateway: istio-system/shoong-gateway
  prefix: /api