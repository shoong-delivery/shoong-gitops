apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shoong-config
  namespace: shoong
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: shoong-config
  data:
    - secretKey: NODE_ENV
      remoteRef:
        key: /shoong/prod/NODE_ENV
    - secretKey: ORDER_API_URL
      remoteRef:
        key: /shoong/prod/ORDER_API_URL
    - secretKey: KITCHEN_API_URL
      remoteRef:
        key: /shoong/prod/KITCHEN_API_URL
    - secretKey: DELIVERY_API_URL
      remoteRef:
        key: /shoong/prod/DELIVERY_API_URL
    - secretKey: NOTIFICATION_API_URL
      remoteRef:
        key: /shoong/prod/NOTIFICATION_API_URL
    - secretKey: ORDER_URL
      remoteRef:
        key: /shoong/prod/batch/ORDER_URL
