apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shoong-config
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: shoong-config
  dataFrom:
    - find:
        path: /shoong/dev
        name:
          regexp: ".*"
