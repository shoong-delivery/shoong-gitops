apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shoong-db-secret
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: shoong-db-secret
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@shoong-dev-db.civ2m2qysqyi.us-east-1.rds.amazonaws.com:5432/shoong_dev"
  data:
    - secretKey: username
      remoteRef:
        key: /shoong/dev/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: /shoong/dev/db-credentials
        property: password
